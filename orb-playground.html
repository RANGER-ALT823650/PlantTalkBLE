<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DiffuseOrb 实验台 · 小球</title>
<style>
  :root{
    --bg:#0e0f12; --panel:#16181d; --panel2:#1d2027; --line:#2a2e37;
    --text:#e7e9ee; --dim:#9aa0ac; --accent:#34c759;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;}
  .app{display:grid;grid-template-columns:360px 1fr;height:100vh;}
  /* ---- 左侧参数面板 ---- */
  .panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px;}
  .panel h1{font-size:14px;margin:0 0 2px;}
  .panel .sub{color:var(--dim);font-size:11px;margin:0 0 12px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;}
  button:hover{border-color:#3a3f4b;}
  button.on{background:var(--accent);color:#04210f;border-color:var(--accent);}
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2);}
  details>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:12.5px;user-select:none;list-style:none;}
  details>summary::-webkit-details-marker{display:none;}
  details>summary::before{content:"▸ ";color:var(--dim);}
  details[open]>summary::before{content:"▾ ";}
  .grp{padding:4px 12px 12px;}
  .row{display:grid;grid-template-columns:1fr 96px 56px;gap:8px;align-items:center;margin:7px 0;}
  .row label{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row input[type=range]{width:100%;}
  .row input[type=number]{width:56px;background:#0f1114;color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-size:11px;}
  .presets{display:flex;gap:6px;margin:2px 0 8px;}
  .presets button{flex:1;font-size:11px;padding:5px 4px;}
  .tintrow{display:flex;align-items:center;gap:10px;margin:8px 0 2px;}
  .tintrow input[type=color]{width:40px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;padding:2px;}
  .soft{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:2px 12px 12px;}
  .soft input{width:100%;background:#0f1114;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:4px;font-size:11px;text-align:center;}
  /* ---- 右侧舞台 ---- */
  .stage{position:relative;display:flex;flex-direction:column;overflow:hidden;}
  .canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;}
  #orb,#overlay{position:absolute;}
  .bgbtns{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:5;}
  .readouts{position:absolute;top:12px;left:12px;z-index:5;background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;min-width:200px;}
  .readouts .k{color:var(--dim);}
  .readouts .v{float:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;}
  .meter{height:6px;background:#2a2e37;border-radius:3px;overflow:hidden;margin:3px 0 7px;}
  .meter>i{display:block;height:100%;width:0;background:var(--accent);}
  .accentflash{margin-top:6px;font-family:ui-monospace,Menlo,monospace;height:16px;}
  .badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;}
  .badge.strong{background:#ff9f0a;color:#3a2400;}
  .badge.color{background:#64d2ff;color:#00303f;}
  /* ---- 底部播放条 ---- */
  .transport{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:12px;}
  .transport input[type=range]{flex:1;}
  .transport .t{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim);min-width:92px;}
  .status{padding:6px 14px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);background:var(--panel);}
  .status.err{color:#ff6b6b;}
  a.filepick{color:var(--accent);text-decoration:underline;cursor:pointer;}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#c7cbd4;}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 左侧参数面板 ============ -->
  <div class="panel">
    <h1>DiffuseOrb 实验台</h1>
    <p class="sub">参数全部来自 <code>ContentView.swift</code> 的 <code>DiffuseOrb</code> / <code>PrimaryInteractionButton</code>。信号处理常量(<code>VoiceVisualDriver</code>)按源码写死,不作旋钮。</p>

    <div class="toolbar">
      <button id="btnReset">重置为源码值</button>
      <button id="btnPoints">网格点</button>
      <button id="btnReload">重载音频</button>
    </div>

    <div class="presets">
      <button data-preset="connected">已连接 绿·1.0</button>
      <button data-preset="preparing">准备中 橙·0.62</button>
      <button data-preset="idle">空闲 蓝·0.34</button>
      <button data-preset="deepgreen">深绿(Preview)</button>
    </div>
    <div class="tintrow">
      <label style="color:var(--dim)">基色 tint <span class="info" data-help="tint">ⓘ</span></label>
      <input type="color" id="tint" value="#34c759" />
      <span id="tintHex" style="font-family:ui-monospace,Menlo,monospace;color:var(--dim)">#34c759</span>
    </div>

    <details open><summary>尺寸 · 状态</summary><div class="grp" id="g-basic"></div></details>
    <details open><summary>外观 · 流动 · 呼吸 · 脉冲(DiffuseOrb)</summary><div class="grp" id="g-orb"></div></details>
    <details><summary>阴影辉光</summary><div class="grp" id="g-shadow"></div></details>
    <details><summary>Softening 混白网格(16 值 · 决定光的方向) <span class="info" data-help="softening">ⓘ</span></summary><div class="soft" id="g-soft"></div></details>
  </div>

  <!-- ============ 右侧舞台 ============ -->
  <div class="stage">
    <div class="canvasWrap" id="wrap">
      <canvas id="orb"></canvas>
      <canvas id="overlay"></canvas>
      <div class="readouts">
        <div><span class="k">dBFS</span><span class="v" id="rd-db">—</span></div>
        <div><span class="k">onset (fast-slow)</span><span class="v" id="rd-onset">—</span></div>
        <div class="k">normalizedLevel(呼吸)</div>
        <div class="meter"><i id="rd-levelbar"></i></div>
        <div><span class="k">scale</span><span class="v" id="rd-scale">1.000</span></div>
        <div class="accentflash" id="rd-accent"></div>
      </div>
      <div class="bgbtns">
        <button data-bg="dark" class="on">深</button>
        <button data-bg="gray">灰</button>
        <button data-bg="light">浅</button>
      </div>
    </div>
    <div class="transport">
      <button id="btnPlay">▶ 播放</button>
      <button id="btnLoop" class="on">循环</button>
      <button id="btnMute">🔊</button>
      <input type="range" id="seek" min="0" max="1000" value="0" />
      <span class="t" id="time">0.0s / 0.0s</span>
    </div>
    <div class="status" id="status">正在载入音频…</div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/wav,audio/*" style="display:none" />

<script>
"use strict";
/* ======================================================================
   参数 —— 只保留源码里 DiffuseOrb / PrimaryInteractionButton 出现的
   视觉常量。默认值即源码值。orbSize 是本实验台的显示尺寸(源码里由布局
   算出,见 actionButtonWidth = contentWidth*0.32)。
   ====================================================================== */
const DEFAULTS = {
  orbSize:260,             // 显示直径(px)。源码为相对布局值,这里给绝对值方便观察
  activity:1, tint:"#34c759",           // PrimaryInteractionButton (:2034-2043)
  breathing:0.012,         // breathing = level * 0.012           (:2071)
  phaseBase:0.34, phaseActivity:0.28,   // phase = time*(0.34+0.28*activity)  (:2066)
  driftBase:0.035, driftActivity:0.07,  // drift = 0.035+0.07*activity        (:2143)
  pulseBase:0.035, pulseIntensity:0.02, // pulse = env*(0.035+0.02*intensity) (:2069)
  baseScale:1.06,          // .scaleEffect(1.06)                  (:2082)
  strokeOpacity:0.28, strokeWidth:1,    // .stroke(.white.opacity(0.28), lineWidth:1) (:2085)
  attackStrong:0.09, releaseStrong:0.5, // accentEnvelope strongPulse (:2187-2188)
  attackColor:0.07, releaseColor:0.34,  // accentEnvelope colorShift  (:2187-2188)
  softeningBump:0.3,       // softening[i] + env*0.3              (:2108)
  shadowOpacity:0.25, shadowRadius:0.12, shadowY:0.05,  // .shadow (:2000-2004)
  softening:[0.12,0.18,0.3,0.22, 0.25,0.38,0.56,0.32, 0.78,0.62,0.88,0.76, 0.9,0.94,1,0.92], // (:2099-2104)
};
let params = structuredClone(DEFAULTS);

const PRESETS = {
  // App 运行时的真实连接色(buttonTint):系统 .green/.orange/.accentColor
  connected:{tint:"#34c759", activity:1},
  preparing:{tint:"#ff9500", activity:0.62},
  idle:{tint:"#0a84ff", activity:0.34},
  // 源码末尾 #Preview 里在试的“中深绿”方案A(ContentView.swift:2366),更饱满厚重
  deepgreen:{tint:"#139e19", activity:1},
};

/* 每个参数的解释 + 源码对应。点 label 旁的 ⓘ 弹出。 */
const HELP = {
  tint:["基色 tint","整颗球的颜色都由这一个基色按不同比例混白得到。运行时由 buttonTint 按语音状态给:已连接 .green / 准备中 .orange / 空闲·出错 .accentColor。","ContentView.swift:2023-2032"],
  orbSize:["小球尺寸","实验台用绝对像素方便看细节。源码里球没有固定尺寸,由布局算出:actionButtonWidth = contentWidth × 0.32,再 .frame(width:) + .aspectRatio(1,.fit) 保持正方形。改尺寸不影响任何动效比例(其余量都是相对值)。","ContentView.swift:1511, 2010"],
  activity:["活跃度 activity","“这颗球有多活跃”的总开关,同时喂给流动速度和涌动幅度。运行时由连接状态决定:已连接 1 / 准备中 0.62 / 空闲·出错 0.34。","ContentView.swift:2034-2043"],
  breathing:["呼吸系数","breathing = clamp(visualLevel,0,1) × 0.012,最终 scale = 1 + breathing + pulse。visualLevel 是音量(0~1)。最大仅 1.2% 缩放,刻意极克制。想让呼吸更明显先动它。","ContentView.swift:2071, 2088"],
  phaseBase:["流动基频","phase = time × (0.34 + 0.28×activity)。phase 决定网格顶点里 sin/cos 转多快 → 渐变流动快慢。这是公式里的常数项 0.34。","ContentView.swift:2066"],
  phaseActivity:["流动·活跃增益","phase 公式里乘 activity 的系数 0.28。activity 越高流动越快:已连接流速 0.62,空闲 ≈0.44。","ContentView.swift:2066"],
  driftBase:["涌动基幅","drift = 0.035 + 0.07×activity,控制顶点漂移幅度 → 涌动起伏大小。这是常数项 0.035。内部 4 点(5/6/9/10)乘满 drift,边缘点乘 drift×0.4~0.45,所以涌动集中在球心。","ContentView.swift:2143, 2147-2176"],
  driftActivity:["涌动·活跃增益","drift 公式里乘 activity 的系数 0.07。已连接 drift=0.105,空闲 ≈0.059。","ContentView.swift:2143"],
  pulseBase:["脉冲缩放·基","pulse = accentEnvelope × (0.035 + 0.02×intensity),仅 strongPulse 时生效。让强脉冲时整球在呼吸之外额外“噗”地弹一下。这是常数项 0.035。","ContentView.swift:2068-2070"],
  pulseIntensity:["脉冲缩放·强度增益","pulse 公式里乘 intensity 的系数 0.02。intensity 是这次脉冲的强度。","ContentView.swift:2069"],
  baseScale:["基础放大 baseScale",".scaleEffect(1.06),仅 iOS18 MeshGradient 分支有(fallback 没有)。让 4×4 网格略微溢出圆形裁剪边界,防止顶点内移时露出背景白边。着色器里用采样坐标 ÷ baseScale 复刻。","ContentView.swift:2082"],
  strokeOpacity:["描边不透明度","Circle().stroke(.white.opacity(0.28), lineWidth:1) — 球边缘那圈白色高光轮廓的不透明度。","ContentView.swift:2084-2085"],
  strokeWidth:["描边宽度","同上 stroke 的 lineWidth,源码为 1。","ContentView.swift:2085"],
  attackStrong:["强脉冲 attack","accentEnvelope 起亮时长(smoothstep p·p·(3-2p) 快速亮起)。strongPulse 为 0.09s。","ContentView.swift:2187, 2190-2192"],
  releaseStrong:["强脉冲 release","accentEnvelope 熄灭时长((1-p)² 缓慢退去)。strongPulse 为 0.5s,起得稳退得慢。","ContentView.swift:2188, 2194-2195"],
  attackColor:["色移 attack","colorShift 的起亮时长 0.07s,比强脉冲更轻快。","ContentView.swift:2187"],
  releaseColor:["色移 release","colorShift 的熄灭时长 0.34s。","ContentView.swift:2188"],
  softeningBump:["高光混白增量","脉冲命中的顶点额外混白:softening[i] += accentEnvelope × 0.3。视觉上就是那一处“泛白发亮”。","ContentView.swift:2106-2109"],
  shadowOpacity:["阴影不透明度","按钮层 .shadow(color: tint.opacity(0.25), …)。关键:阴影用 tint 色而非黑色 → 彩色辉光,让球像浮着发光。","ContentView.swift:2000-2004"],
  shadowRadius:["阴影半径系数","shadow radius = width × 0.12,相对球宽,球放大时辉光同步放大。","ContentView.swift:2002"],
  shadowY:["阴影 Y 偏移系数","shadow y = width × 0.05。","ContentView.swift:2003"],
  softening:["Softening 混白网格","16 个值对应 4×4 网格 16 个顶点的混白量:tint.mix(with:.white, by:amount, in:.perceptual)。0=纯 tint,1=纯白。默认从左上(≈纯色)到右下(≈纯白),形成“光从右下漫射”的立体感。混色在 Oklab(=.perceptual)里做。","ContentView.swift:2099-2104, 2116"],
};
const GROUPS = {
  "g-basic":[
    ["orbSize","小球尺寸 (px)",80,600,1],
    ["activity","活跃度 activity",0,1,0.01],
  ],
  "g-orb":[
    ["breathing","呼吸系数 (×level)",0,0.2,0.001],
    ["phaseBase","流动基频",0,2,0.01],
    ["phaseActivity","流动·活跃增益",0,2,0.01],
    ["driftBase","涌动基幅",0,0.3,0.001],
    ["driftActivity","涌动·活跃增益",0,0.3,0.001],
    ["pulseBase","脉冲缩放·基",0,0.3,0.001],
    ["pulseIntensity","脉冲缩放·强度增益",0,0.3,0.001],
    ["baseScale","基础放大 baseScale",1,1.3,0.005],
    ["strokeOpacity","描边不透明度",0,1,0.01],
    ["strokeWidth","描边宽度 (px)",0,5,0.1],
    ["attackStrong","强脉冲 attack (s)",0,0.5,0.005],
    ["releaseStrong","强脉冲 release (s)",0,2,0.01],
    ["attackColor","色移 attack (s)",0,0.5,0.005],
    ["releaseColor","色移 release (s)",0,2,0.01],
    ["softeningBump","高光混白增量",0,1,0.01],
  ],
  "g-shadow":[
    ["shadowOpacity","阴影不透明度",0,1,0.01],
    ["shadowRadius","阴影半径系数 (×w)",0,0.4,0.005],
    ["shadowY","阴影 Y 偏移系数 (×w)",0,0.3,0.005],
  ],
};

/* ---- 帮助浮层 ---- */
const pop=document.createElement("div"); pop.id="helpPop"; pop.style.display="none"; document.body.appendChild(pop);
function showHelp(key, anchor){
  const h=HELP[key]; if(!h) return;
  pop.innerHTML=`<div class="hp-t">${h[0]} <span class="hp-k">${key}</span></div><div class="hp-b">${h[1]}</div><div class="hp-s">📄 ${h[2]}</div>`;
  pop.style.display="block";
  const r=anchor.getBoundingClientRect();
  pop.style.top=Math.min(window.innerHeight-pop.offsetHeight-10, r.bottom+6)+"px";
  pop.style.left=Math.min(window.innerWidth-pop.offsetWidth-10, r.left)+"px";
}
function hideHelp(){ pop.style.display="none"; }
document.addEventListener("click",e=>{ if(!pop.contains(e.target) && !e.target.classList.contains("info")) hideHelp(); });

function makeInfo(key){
  const b=document.createElement("span"); b.className="info"; b.textContent="ⓘ"; b.title="说明";
  b.addEventListener("click",e=>{ e.stopPropagation(); if(pop.style.display==="block"&&pop.dataset.k===key){ hideHelp(); } else { pop.dataset.k=key; showHelp(key,b); } });
  return b;
}

/* ---- 构建滑块 ---- */
const inputRefs = {};
function buildSlider(container, key, label, min, max, step){
  const row = document.createElement("div"); row.className="row";
  const l = document.createElement("label"); l.textContent=label; l.title=label+"  ("+key+")";
  l.appendChild(makeInfo(key));
  const r = document.createElement("input"); r.type="range"; r.min=min; r.max=max; r.step=step; r.value=params[key];
  const n = document.createElement("input"); n.type="number"; n.min=min; n.max=max; n.step=step; n.value=params[key];
  const commit = (v)=>{ if(isNaN(v))return; v=Math.max(min,Math.min(max,v)); params[key]=v; r.value=v; n.value=v; onParamChange(key); };
  r.addEventListener("input",()=>commit(parseFloat(r.value)));
  n.addEventListener("input",()=>commit(parseFloat(n.value)));
  row.append(l,r,n); container.appendChild(row);
  inputRefs[key]={range:r,number:n};
}
for(const [gid, items] of Object.entries(GROUPS)){
  const c=document.getElementById(gid);
  for(const it of items) buildSlider(c, ...it);
}
const softRefs=[];
{
  const c=document.getElementById("g-soft");
  for(let i=0;i<16;i++){
    const n=document.createElement("input"); n.type="number"; n.min=0; n.max=1; n.step=0.01; n.value=params.softening[i]; n.title="softening["+i+"]";
    n.addEventListener("input",()=>{ params.softening[i]=Math.max(0,Math.min(1,parseFloat(n.value)||0)); });
    c.appendChild(n); softRefs.push(n);
  }
}
function syncAllInputs(){
  for(const [k,ref] of Object.entries(inputRefs)){ ref.range.value=params[k]; ref.number.value=params[k]; }
  for(let i=0;i<16;i++) softRefs[i].value=params.softening[i];
  document.getElementById("tint").value=params.tint;
  document.getElementById("tintHex").textContent=params.tint;
}

const tintEl=document.getElementById("tint");
tintEl.addEventListener("input",()=>{ params.tint=tintEl.value; document.getElementById("tintHex").textContent=tintEl.value; onParamChange("tint"); });
document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{
  const p=PRESETS[b.dataset.preset]; params.tint=p.tint; params.activity=p.activity; syncAllInputs(); onParamChange("tint");
}));
document.getElementById("btnReset").addEventListener("click",()=>{ params=structuredClone(DEFAULTS); syncAllInputs(); onParamChange("tint"); resizeCanvas(); });

document.querySelectorAll("[data-bg]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-bg]").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const m={dark:"#0e0f12",gray:"#8a8f99",light:"#f2f3f5"};
  document.getElementById("wrap").style.background=m[b.dataset.bg];
}));

let showPoints=false;
document.getElementById("btnPoints").addEventListener("click",e=>{ showPoints=!showPoints; e.target.classList.toggle("on",showPoints); if(!showPoints&&octx) octx.clearRect(0,0,overlay.width,overlay.height); });

/* ---- 颜色 ---- */
function hexToRgb01(hex){ const h=hex.replace("#",""); return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]; }
function srgbToLinear(c){ return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
// ⭐ 关键保真:源码是 tint.mix(with:.white, in:.perceptual)(ContentView.swift:2116)。
//   .perceptual = 感知均匀空间(Oklab 类)。之前在“线性光空间”混白会抬高中间调、冲淡
//   饱和度 → 颜色发淡。改为在 Oklab 里混白,还原真机质感。
function srgbToOklab([r,g,b]){
  const lr=srgbToLinear(r), lg=srgbToLinear(g), lb=srgbToLinear(b);
  const l=Math.cbrt(0.4122214708*lr+0.5363325363*lg+0.0514459929*lb);
  const m=Math.cbrt(0.2119034982*lr+0.6806995451*lg+0.1073969566*lb);
  const s=Math.cbrt(0.0883024619*lr+0.2817188376*lg+0.6299787005*lb);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,
          1.9779984951*l-2.4285922050*m+0.4505937099*s,
          0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
let tintOklab=[0,0,0];
function updateTintOklab(){ tintOklab=srgbToOklab(hexToRgb01(params.tint)); }

function onParamChange(key){
  if(key==="tint") updateTintOklab();
  updateShadow();
  if(key==="orbSize") resizeCanvas();
}
function updateShadow(){
  const rgb=hexToRgb01(params.tint).map(x=>Math.round(x*255));
  const w=params.orbSize;
  orb.style.filter=`drop-shadow(0px ${(w*params.shadowY).toFixed(1)}px ${(w*params.shadowRadius).toFixed(1)}px rgba(${rgb[0]},${rgb[1]},${rgb[2]},${params.shadowOpacity}))`;
}

/* ======================================================================
   VoiceVisualDriver —— 移植自 RealtimeAudioIO.swift:59-195
   信号处理常量按源码写死。preview 音频源固定为 .assistant。
   ====================================================================== */
class VoiceVisualDriver{
  constructor(){ this.reset(); }
  reset(){
    this.normalizedLevel=0; this.accent=null;
    this.fast=null; this.slow=null; this.lastAudibleAt=null;
    this.lastColorShiftAt=-Infinity; this.lastStrongPulseAt=-Infinity;
    this.strongPulseTimes=[]; this.lastMeshPointIndex=null;
    this._onset=0; this._lastLevel=-160;
  }
  ingest(levelDBFS, now){
    const level=Math.min(-3, Math.max(-80, levelDBFS));
    this._lastLevel=level;
    if(this.fast===null){
      this.fast=level; this.slow=level;
      if(level>-48) this.lastAudibleAt=now;
      this._updateDisplay(level); this._onset=0; return;
    }
    const fast=this.fast*0.55 + level*0.45;   // 快包络
    const slow=this.slow*0.93 + level*0.07;   // 慢包络
    this.fast=fast; this.slow=slow;
    if(this.lastAudibleAt!==null && now-this.lastAudibleAt>=1.2) this.strongPulseTimes=[];
    if(level>-48) this.lastAudibleAt=now;
    this._updateDisplay(level);
    this._onset=fast-slow;
    if(level<=-48) return;
    const onset=fast-slow;
    this.strongPulseTimes=this.strongPulseTimes.filter(t=> now-t<4);
    // strongPulse: 阈值 4.2(assistant) / 冷却 0.65 / 4s 内 ≤3
    if(onset>=4.2 && now-this.lastStrongPulseAt>=0.65 && this.strongPulseTimes.length<3){
      const intensity=Math.min(1,Math.max(0,(onset-4.2)/8));
      const prob=Math.min(0.82, 0.3+intensity*0.52);
      if(Math.random()<=prob){ this._emit("strong",intensity,now); this.lastStrongPulseAt=now; this.lastColorShiftAt=now; this.strongPulseTimes.push(now); return; }
    }
    // colorShift: 阈值 2.0(assistant) / 冷却 0.35
    if(onset>=2.0 && now-this.lastColorShiftAt>=0.35){
      const intensity=Math.min(1,Math.max(0,(onset-2.0)/6));
      const prob=Math.min(0.72, 0.24+intensity*0.48);
      if(Math.random()<=prob){ this._emit("color",intensity,now); this.lastColorShiftAt=now; }
    }
  }
  _updateDisplay(levelDBFS){
    const target=Math.min(1,Math.max(0,(levelDBFS+55)/43));  // (dBFS+55)/43
    this.normalizedLevel=this.normalizedLevel*0.78 + target*0.22;
  }
  _emit(kind,intensity,now){
    const idxs=[5,6,9,10];  // 内部网格点
    let pos=Math.min(3, Math.floor(Math.random()*4));
    if(idxs[pos]===this.lastMeshPointIndex) pos=(pos+1)%4;
    const pointIndex=idxs[pos]; this.lastMeshPointIndex=pointIndex;
    const angle=Math.random()*Math.PI*2;
    const base= kind==="strong"?0.06:0.03;
    const range= kind==="strong"?0.035:0.02;
    const amp=base+range*intensity;
    this.accent={kind,meshPointIndex:pointIndex,offset:[Math.cos(angle)*amp,Math.sin(angle)*amp],intensity,startedAt:now};
  }
}
const driver=new VoiceVisualDriver();

// accentEnvelope —— DiffuseOrb.accentEnvelope (:2184-2196)
function accentEnvelope(now){
  const a=driver.accent; if(!a) return 0; const P=params;
  const elapsed=Math.max(0, now-a.startedAt);
  const attack= a.kind==="strong"?P.attackStrong:P.attackColor;
  const release= a.kind==="strong"?P.releaseStrong:P.releaseColor;
  if(elapsed<attack){ const p=elapsed/attack; return p*p*(3-2*p); }
  const p=Math.min(1,(elapsed-attack)/release); return (1-p)*(1-p);
}
// meshPoints —— DiffuseOrb.meshPoints (:2139-2182)
function meshPoints(phase, env){
  const activity=params.activity, drift=params.driftBase+params.driftActivity*activity;
  const pts=[
    [0,0],
    [0.33+Math.sin(phase*0.73)*drift*0.45, 0],
    [0.67+Math.cos(phase*0.81)*drift*0.45, 0],
    [1,0],
    [0, 0.33+Math.cos(phase*0.69)*drift*0.4],
    [0.33+Math.cos(phase*0.91)*drift, 0.33+Math.sin(phase*1.13)*drift],
    [0.67+Math.sin(phase*1.19)*drift, 0.33+Math.cos(phase*0.83)*drift],
    [1, 0.33+Math.sin(phase*0.77)*drift*0.4],
    [0, 0.67+Math.sin(phase*0.87)*drift*0.4],
    [0.33+Math.sin(phase*0.71)*drift, 0.67+Math.cos(phase*1.07)*drift],
    [0.67+Math.cos(phase*0.67)*drift, 0.67+Math.sin(phase*0.89)*drift],
    [1, 0.67+Math.cos(phase*0.93)*drift*0.4],
    [0,1],
    [0.33+Math.cos(phase*0.79)*drift*0.45, 1],
    [0.67+Math.sin(phase*0.75)*drift*0.45, 1],
    [1,1],
  ];
  const a=driver.accent;
  if(a){ const i=a.meshPointIndex; pts[i]=[pts[i][0]+a.offset[0]*env, pts[i][1]+a.offset[1]*env]; }
  return pts;
}
// meshColors + softened (:2098-2117)。混白在 Oklab 里做(= SwiftUI .perceptual),
// 再转回线性 RGB 交给着色器(着色器最后 l2s 线性→sRGB)。白在 Oklab 为 (1,0,0)。
const colorBuf=new Float32Array(48);
function oklabToLinear(L,A,B){
  const l_=L+0.3963377774*A+0.2158037573*B;
  const m_=L-0.1055613458*A-0.0638541728*B;
  const s_=L-0.0894841775*A-1.2914855480*B;
  const l=l_*l_*l_, m=m_*m_*m_, s=s_*s_*s_;
  return [ 4.0767416621*l-3.3077115913*m+0.2309699292*s,
          -1.2684380046*l+2.6097574011*m-0.3413193965*s,
          -0.0041960863*l-0.7034186147*m+1.7076147010*s];
}
function meshColorsLinear(env){
  const soft=params.softening.slice();
  const a=driver.accent;
  if(a) soft[a.meshPointIndex]=Math.min(1, soft[a.meshPointIndex]+env*params.softeningBump);
  const [tL,tA,tB]=tintOklab;
  for(let i=0;i<16;i++){ const m=soft[i];
    // 向白(L=1,a=0,b=0)插值
    const rgb=oklabToLinear(tL+(1-tL)*m, tA*(1-m), tB*(1-m));
    colorBuf[i*3]=rgb[0]; colorBuf[i*3+1]=rgb[1]; colorBuf[i*3+2]=rgb[2];
  }
  return colorBuf;
}

/* ======================================================================
   WebGL: 4×4 双三次网格渐变(MeshGradient 还原)
   ====================================================================== */
const orb=document.getElementById("orb");
const overlay=document.getElementById("overlay");
const octx=overlay.getContext("2d");
const gl=orb.getContext("webgl2",{alpha:true, premultipliedAlpha:false, antialias:true});
const DPR=Math.min(2, window.devicePixelRatio||1);

const VERT=`#version 300 es
in vec2 aPos; void main(){ gl_Position=vec4(aPos,0.0,1.0); }`;
const FRAG=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;
uniform vec2 uPoints[16];
uniform vec3 uColors[16];
uniform float uRadius, uBaseScale, uStrokeOpacity, uStrokeWidth;
vec4 cubicW(float t){
  float a=t-0.3333333, b=t-0.6666667, c=t-1.0;
  return vec4( (a*b*c)/(-0.2222222), (t*b*c)/(0.0740741), (t*a*c)/(-0.0740741), (t*a*b)/(0.2222222) );
}
vec2 sPos(float u,float v){
  vec4 wu=cubicW(u), wv=cubicW(v);
  vec2 r0=wu.x*uPoints[0]+wu.y*uPoints[1]+wu.z*uPoints[2]+wu.w*uPoints[3];
  vec2 r1=wu.x*uPoints[4]+wu.y*uPoints[5]+wu.z*uPoints[6]+wu.w*uPoints[7];
  vec2 r2=wu.x*uPoints[8]+wu.y*uPoints[9]+wu.z*uPoints[10]+wu.w*uPoints[11];
  vec2 r3=wu.x*uPoints[12]+wu.y*uPoints[13]+wu.z*uPoints[14]+wu.w*uPoints[15];
  return wv.x*r0+wv.y*r1+wv.z*r2+wv.w*r3;
}
vec3 sCol(float u,float v){
  vec4 wu=cubicW(u), wv=cubicW(v);
  vec3 r0=wu.x*uColors[0]+wu.y*uColors[1]+wu.z*uColors[2]+wu.w*uColors[3];
  vec3 r1=wu.x*uColors[4]+wu.y*uColors[5]+wu.z*uColors[6]+wu.w*uColors[7];
  vec3 r2=wu.x*uColors[8]+wu.y*uColors[9]+wu.z*uColors[10]+wu.w*uColors[11];
  vec3 r3=wu.x*uColors[12]+wu.y*uColors[13]+wu.z*uColors[14]+wu.w*uColors[15];
  return wv.x*r0+wv.y*r1+wv.z*r2+wv.w*r3;
}
vec3 l2s(vec3 c){ c=clamp(c,0.0,1.0);
  vec3 lo=c*12.92, hi=1.055*pow(c,vec3(1.0/2.4))-0.055;
  return mix(lo,hi,step(vec3(0.0031308),c)); }
void main(){
  vec2 d=gl_FragCoord.xy-uRes*0.5; d.y=-d.y;
  vec2 local=d/uRadius;
  float dist=length(local);
  float aa=1.5/uRadius;
  float cov=1.0-smoothstep(1.0-aa,1.0+aa,dist);
  if(cov<=0.0){ o=vec4(0.0); return; }
  vec2 mp=0.5+0.5*(local/uBaseScale);
  vec2 uv=mp;
  for(int i=0;i<4;i++){ vec2 p=sPos(uv.x,uv.y); uv+=(mp-p); }
  uv=clamp(uv,0.0,1.0);
  vec3 rgb=l2s(sCol(uv.x,uv.y));
  float halfW=(uStrokeWidth*0.5)/uRadius;
  float ring=(1.0-smoothstep(halfW,halfW+aa,abs(dist-1.0)))*step(dist,1.0);
  rgb=mix(rgb, vec3(1.0), ring*uStrokeOpacity);
  o=vec4(rgb, cov);
}`;
function compile(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog, U={};
if(gl){
  prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"aPos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  for(const u of ["uRes","uPoints","uColors","uRadius","uBaseScale","uStrokeOpacity","uStrokeWidth"]) U[u]=gl.getUniformLocation(prog,u);
} else {
  document.getElementById("status").textContent="此浏览器不支持 WebGL2,无法渲染。请用较新的 Chrome / Safari / Edge。";
}
const pointBuf=new Float32Array(32);

function resizeCanvas(){
  const box=Math.ceil(params.orbSize*1.18);
  for(const cv of [orb,overlay]){ cv.style.width=box+"px"; cv.style.height=box+"px"; cv.width=Math.ceil(box*DPR); cv.height=Math.ceil(box*DPR); }
  if(gl) gl.viewport(0,0,orb.width,orb.height);
  updateShadow();
}

/* ======================================================================
   渲染
   ====================================================================== */
function render(now){
  if(!gl) return null;
  const activity=params.activity;
  const phase=now*(params.phaseBase+params.phaseActivity*activity);
  const env=accentEnvelope(now);
  const pulse=(driver.accent&&driver.accent.kind==="strong") ? env*(params.pulseBase+params.pulseIntensity*driver.accent.intensity) : 0;
  const breathing=Math.min(1,Math.max(0,driver.normalizedLevel))*params.breathing;
  const scale=1+breathing+pulse;
  const radiusPx=(params.orbSize/2)*scale*DPR;

  const pts=meshPoints(phase,env);
  for(let i=0;i<16;i++){ pointBuf[i*2]=pts[i][0]; pointBuf[i*2+1]=pts[i][1]; }
  const cols=meshColorsLinear(env);

  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes, orb.width, orb.height);
  gl.uniform2fv(U.uPoints, pointBuf);
  gl.uniform3fv(U.uColors, cols);
  gl.uniform1f(U.uRadius, radiusPx);
  gl.uniform1f(U.uBaseScale, params.baseScale);
  gl.uniform1f(U.uStrokeOpacity, params.strokeOpacity);
  gl.uniform1f(U.uStrokeWidth, params.strokeWidth*DPR);
  gl.drawArrays(gl.TRIANGLES,0,3);

  if(showPoints){
    const box=overlay.width/DPR, cx=box/2, cy=box/2, R=(params.orbSize/2)*scale, bs=params.baseScale;
    octx.setTransform(DPR,0,0,DPR,0,0); octx.clearRect(0,0,box,box);
    for(let i=0;i<16;i++){
      const x=cx+(pts[i][0]*2-1)*bs*R, y=cy+(pts[i][1]*2-1)*bs*R;
      const isAccent=driver.accent&&driver.accent.meshPointIndex===i&&env>0.02;
      octx.beginPath(); octx.arc(x,y,isAccent?5:3,0,Math.PI*2);
      octx.fillStyle=isAccent?"#ff3b30":"rgba(255,255,255,.7)"; octx.fill();
    }
  }
  return {scale};
}

/* ======================================================================
   音频: 载入 → 每 90ms 帧算 dBFS → 播放时喂给 driver(同 iOS preview)
   ====================================================================== */
const FRAME=0.09;
const AUDIO_URL="ios/PlantTalkBLE/PreviewAudio/gpt-live-image-interaction.wav";
let audioCtx, audioBuffer, levels=[], duration=0, gainNode;
let playing=false, loopOn=true, muted=false;
let source=null, srcStartCtx=0, startOffset=0, playStartClock=0, nextFrameIndex=0;

function status(msg,isErr){ const s=document.getElementById("status"); s.textContent=msg; s.classList.toggle("err",!!isErr); }
function ensureCtx(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); gainNode=audioCtx.createGain(); gainNode.connect(audioCtx.destination);} return audioCtx; }

function computeLevels(buf){
  const sr=buf.sampleRate, n=buf.length, ch=buf.numberOfChannels;
  let mono=buf.getChannelData(0);
  if(ch>1){ mono=new Float32Array(n); for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++) mono[i]+=d[i]; } for(let i=0;i<n;i++) mono[i]/=ch; }
  const fr=Math.max(1,Math.round(sr*FRAME)), out=[];
  for(let s=0;s<n;s+=fr){ const e=Math.min(n,s+fr); let ss=0; for(let i=s;i<e;i++){ const v=mono[i]; ss+=v*v; }
    const rms=Math.sqrt(ss/Math.max(1,e-s)); out.push(rms>0?20*Math.log10(rms):-160); }
  return out;
}
async function decodeAndPrep(arrayBuffer){
  ensureCtx();
  audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);
  levels=computeLevels(audioBuffer); duration=audioBuffer.duration;
  document.getElementById("btnPlay").disabled=false;
  status(`已载入 · ${duration.toFixed(1)}s · ${audioBuffer.sampleRate}Hz · ${levels.length} 帧(每帧 ${FRAME*1000}ms)`);
  updateTime();
}
async function loadDefaultAudio(){
  status("正在载入音频…");
  try{
    const res=await fetch(AUDIO_URL); if(!res.ok) throw new Error("HTTP "+res.status);
    await decodeAndPrep(await res.arrayBuffer());
  }catch(e){
    const s=document.getElementById("status"); s.classList.add("err");
    s.innerHTML="自动载入失败(多半是用 file:// 双击打开了本页)。请通过本地服务器打开,或 <a class='filepick' id='pick'>点此手动选择 WAV</a>。 错误: "+e.message;
    const p=document.getElementById("pick"); if(p) p.addEventListener("click",()=>document.getElementById("fileInput").click());
  }
}
document.getElementById("fileInput").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return; status("正在解码 "+f.name+" …");
  try{ await decodeAndPrep(await f.arrayBuffer()); }catch(err){ status("解码失败: "+err.message,true); }
});
document.getElementById("btnReload").addEventListener("click",loadDefaultAudio);

function startSource(offset){
  ensureCtx(); if(audioCtx.state==="suspended") audioCtx.resume();
  if(source){ try{source.onended=null; source.stop();}catch(_){} }
  source=audioCtx.createBufferSource(); source.buffer=audioBuffer; source.connect(gainNode);
  srcStartCtx=audioCtx.currentTime; startOffset=offset;
  playStartClock=performance.now()/1000 - offset;
  nextFrameIndex=Math.floor(offset/FRAME);
  driver.reset();
  source.start(0,offset); playing=true; document.getElementById("btnPlay").textContent="⏸ 暂停";
}
function stopPlayback(){ if(source){ try{source.onended=null; source.stop();}catch(_){} } playing=false; document.getElementById("btnPlay").textContent="▶ 播放"; }
function currentPos(){ return playing ? startOffset+(audioCtx.currentTime-srcStartCtx) : startOffset; }

document.getElementById("btnPlay").addEventListener("click",()=>{
  if(!audioBuffer) return;
  if(playing){ startOffset=currentPos(); stopPlayback(); } else { startSource(startOffset>=0&&startOffset<duration?startOffset:0); }
});
document.getElementById("btnLoop").addEventListener("click",e=>{ loopOn=!loopOn; e.target.classList.toggle("on",loopOn); });
document.getElementById("btnMute").addEventListener("click",e=>{ muted=!muted; if(gainNode) gainNode.gain.value=muted?0:1; e.target.textContent=muted?"🔇":"🔊"; });
const seekEl=document.getElementById("seek");
seekEl.addEventListener("input",()=>{ if(!audioBuffer) return; const t=seekEl.value/1000*duration;
  if(playing) startSource(t); else { startOffset=t; updateTime(); } });
window.addEventListener("keydown",e=>{ if(e.code==="Space" && e.target.tagName!=="INPUT"){ e.preventDefault(); document.getElementById("btnPlay").click(); }});

function feed(pos){
  const cur=Math.min(levels.length-1, Math.floor(pos/FRAME));
  while(nextFrameIndex<=cur){ driver.ingest(levels[nextFrameIndex], playStartClock+nextFrameIndex*FRAME); nextFrameIndex++; }
}
function updateTime(){ document.getElementById("time").textContent=`${currentPos().toFixed(1)}s / ${duration.toFixed(1)}s`; if(!playing&&duration) seekEl.value=currentPos()/duration*1000; }

/* ---- 读数 & 主循环 ---- */
function updateReadouts(now, rr){
  document.getElementById("rd-db").textContent=driver._lastLevel.toFixed(1);
  document.getElementById("rd-onset").textContent=driver._onset.toFixed(2);
  document.getElementById("rd-levelbar").style.width=(driver.normalizedLevel*100).toFixed(0)+"%";
  document.getElementById("rd-scale").textContent=(rr?rr.scale:1).toFixed(3);
  const el2=document.getElementById("rd-accent"); const a=driver.accent;
  if(a && accentEnvelope(now)>0.02){
    el2.innerHTML=`<span class="badge ${a.kind}">${a.kind==="strong"?"strongPulse":"colorShift"}</span> i=${a.intensity.toFixed(2)} pt${a.meshPointIndex}`;
  } else el2.innerHTML="";
}
function loop(){
  const now=performance.now()/1000;
  if(playing){ const pos=currentPos();
    if(pos>=duration-0.001){ if(loopOn) startSource(0); else { startOffset=duration; stopPlayback(); } }
    else { feed(pos); seekEl.value=pos/duration*1000; }
  }
  updateTime();
  const rr=render(now);
  updateReadouts(now, rr);
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
document.getElementById("btnPlay").disabled=true;
updateTintOklab(); resizeCanvas(); updateShadow();
document.getElementById("wrap").style.background="#0e0f12";
requestAnimationFrame(loop);
loadDefaultAudio();
</script>
</body>
</html>
