name: PlantTalkBLE
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.10.0
targets:
  ArtworkPreviewLab:
    type: application
    platform: iOS
    sources:
      - ArtworkPreviewLab
      - path: PlantTalkBLE/PlantArtworkView.swift
      - path: PlantTalkBLE/AIConfiguration.swift
      - path: PlantTalkBLE/PlantImageGenerationClient.swift
    info:
      path: ArtworkPreviewLab/Info.plist
      properties:
        CFBundleDisplayName: 植物图片预览台
        NSCameraUsageDescription: 预览台演示拍摄植物图片。
        NSPhotoLibraryUsageDescription: 预览台演示从相册选择植物图片。
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ArtworkPreviewLab
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZT3X6444JT
  OrbTuningLab:
    type: application
    platform: iOS
    sources:
      - OrbTuningLab
    info:
      path: OrbTuningLab/Info.plist
      properties:
        CFBundleDisplayName: 小球调参实验台
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.OrbTuningLab
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZT3X6444JT
  PlantTalkBLE:
    type: application
    platform: iOS
    sources:
      - path: PlantTalkBLE
        excludes:
          - DeepSeekToolSimulationMain.swift
          - PlantBluetoothManagerCLISimulationStub.swift
    info:
      path: PlantTalkBLE/Info.plist
      properties:
        CFBundleDisplayName: Plant Talk
        NSBluetoothAlwaysUsageDescription: 此 App 使用蓝牙连接植物传感器并读取环境数据。
        NSCameraUsageDescription: 此 App 使用相机拍摄植物照片并进行状态分析。
        NSMicrophoneUsageDescription: 此 App 使用麦克风与植物进行实时语音对话。
        NSPhotoLibraryUsageDescription: 此 App 使用相册中的植物照片进行状态分析和实时对话。
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PlantTalkBLE
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZT3X6444JT
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
  PlantTalkBLETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlantTalkBLETests
    dependencies:
      - target: PlantTalkBLE
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
